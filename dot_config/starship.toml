format = """$python$username$directory$git_branch$git_status$cmd_duration
$character"""
palette = "vesper"

[palettes.vesper]
peach = "#ffc799"
mint  = "#99ffe4"
red   = "#ff8080"
grey  = "#a0a0a0"
dim   = "#505050"

[python]
format = "[(\\($virtualenv\\) )]($style)"
style = "mint"

[username]
format = "[$user]($style) in "
style_user = "grey"
show_always = false

[directory]
style = "bold peach"
format = "[$path]($style) "
truncation_length = 0
truncation_symbol = ""

[git_branch]
format = "[$symbol]($style)[\\($branch\\)](mint) "
symbol = "git:"
style = "dim"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
modified = "±$count"
staged = "+$count"
untracked = "?$count"
deleted = "-$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕"
stashed = "≡$count"
style = "peach"

[cmd_duration]
min_time = 1000
format = "[$duration]($style)"
style = "grey"

[character]
success_symbol = "[\\$](mint)"
error_symbol = "[\\$](bold red)"
